name: kong-ai-gw
x-kong-common: &kong-common
  image: kong/kong-ai-gateway:2.2.0-distroless
  platform: linux/amd64
  pull_policy: never
  restart: unless-stopped
  volumes:
    - ./license.json:/etc/kong/license.json:ro
    - ./certs/cluster.crt:/certs/cluster.crt:ro
    - ./certs/cluster.key:/certs/cluster.key:ro
  env_file: [.env]
  environment: &kong-env
    KONG_ANONYMOUS_REPORTS: "off"
    KONG_CLUSTER_CERT: /certs/cluster.crt
    KONG_CLUSTER_CERT_KEY: /certs/cluster.key
    KONG_CLUSTER_MTLS: shared

services:
  postgres:
    image: postgres:16.4
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: kong
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      timeout: 3s
      retries: 20

  kong-migrations:
    <<: *kong-common
    command: ["kong", "migrations", "bootstrap"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *kong-env
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${PG_PASSWORD}

  kong-cp:
    <<: *kong-common
    depends_on:
      kong-migrations: {condition: service_completed_successfully}
    environment:
      <<: *kong-env
      KONG_ROLE: control_plane
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${PG_PASSWORD}
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_CLUSTER_LISTEN: 0.0.0.0:8005
      KONG_CLUSTER_TELEMETRY_LISTEN: 0.0.0.0:8006
      KONG_PROXY_LISTEN: "off"
      KONG_PG_TIMEOUT: "30000"   # ms; default 5000 turns Postgres stalls on a slow host into Admin API 500s
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  kong-dp:
    <<: *kong-common
    depends_on:
      kong-cp: {condition: service_healthy}
    environment:
      <<: *kong-env
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_CLUSTER_CONTROL_PLANE: kong-cp:8005
      KONG_CLUSTER_TELEMETRY_ENDPOINT: kong-cp:8006
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports: ["8000:8000", "8443:8443"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
